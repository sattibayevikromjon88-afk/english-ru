<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rus tili — noldan suhbatgacha (o'zbekcha)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f4fb;color:#1d2330}
  header{background:#c0392b;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
  .hrow{display:flex;align-items:center;gap:8px}
  h1{margin:0;font-size:18px;flex:1}
  .hbtn{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:18px;padding:7px 11px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .round{width:34px;height:34px;padding:0;border-radius:50%;font-size:17px}
  main{padding:14px;max-width:760px;margin:0 auto}
  .box{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .box h2{margin:0 0 8px;font-size:18px}
  .muted{color:#5b6475;font-size:14px}
  .pace{display:block;width:100%;text-align:left;border:2px solid #e3dff0;background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;line-height:1.4}
  .pace b{font-size:17px}
  .pace.on{border-color:#c0392b;background:#fff3f1}
  .bar{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:#27ae60}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:90px;background:#f6f4fb;border-radius:12px;padding:8px 10px;text-align:center}
  .stat b{display:block;font-size:20px}
  .plan li{margin:6px 0;font-size:15px}
  .big{display:block;width:100%;border:0;background:#c0392b;color:#fff;border-radius:12px;padding:14px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
  .big.sec{background:#fff;color:#c0392b;border:2px solid #c0392b}
  .lrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f0edf6;font-size:15px}
  .lrow:last-child{border-bottom:0}
  .lrow .n{width:30px;height:30px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 30px}
  .lrow.done .n{background:#27ae60;color:#fff}
  .lrow.cur .n{background:#c0392b;color:#fff}
  .lrow.lock{color:#9aa1ae}
  .lrow.click{cursor:pointer}
  .steps{display:flex;gap:4px;margin-bottom:10px}
  .steps i{flex:1;height:6px;border-radius:4px;background:#e3dff0}
  .steps i.on{background:#c0392b}
  .lex p,.lex li{font-size:15.5px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{background:#fff;border:2px solid #efeaf7;border-radius:14px;padding:10px;text-align:center;cursor:pointer;user-select:none}
  .card:active{transform:scale(.97)}
  .card .ru{font-size:19px;font-weight:700}
  .card .tr{font-size:13.5px;color:#8e44ad;margin-top:2px}
  .card .uz{font-size:14.5px;color:#3a4252;margin-top:4px}
  .dline{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:#f6f4fb;margin:7px 0;cursor:pointer}
  .dline .who{font-weight:700;color:#c0392b;min-width:64px;font-size:13px;padding-top:2px}
  .dline .ru{font-size:16.5px}
  .dline .uz{font-size:13.5px;color:#5b6475;margin-top:2px}
  .q{font-size:18px;margin:6px 0 12px;text-align:center}
  .opts{display:grid;grid-template-columns:1fr;gap:8px}
  .opts button{font-size:17px;padding:12px;border-radius:12px;border:2px solid #e3dff0;background:#fff;cursor:pointer;text-align:center}
  .opts button.ok{background:#dff6e7;border-color:#27ae60}
  .opts button.bad{background:#fde2e0;border-color:#e04848}
  .fb{min-height:22px;margin-top:10px;font-size:15px;font-weight:600;text-align:center}
  .sprompt{font-size:17px;margin:4px 0 8px}
  .reveal{border:0;background:#f6f4fb;color:#c0392b;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer}
  .ans{display:none;font-size:18px;font-weight:700;margin-top:8px}
  .sp{padding:10px 0;border-bottom:1px solid #f0edf6}
  .sp:last-child{border-bottom:0}
  .say{border:0;background:#f6f4fb;color:#c0392b;border-radius:18px;padding:8px 14px;font-size:15px;cursor:pointer}
  .center{text-align:center}
  /* tour */
  .tblock{position:fixed;inset:0;z-index:60;background:transparent}
  .tspot{position:fixed;z-index:61;border-radius:14px;box-shadow:0 0 0 4px #ffd23f,0 0 0 9999px rgba(15,25,50,.72);pointer-events:none;transition:all .25s}
  .tspot.none{box-shadow:0 0 0 9999px rgba(15,25,50,.72)}
  .tbubble{position:fixed;z-index:62;left:12px;right:12px;max-width:440px;margin:0 auto;background:#fff;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  .tbubble .bigt{font-size:21px;font-weight:700;display:block;margin-bottom:4px}
  .tbubble .small{font-size:13px;color:#5b6475;display:block;margin-top:6px}
  .tbtns{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .tskip{border:0;background:none;color:#7a8396;font-size:14px;cursor:pointer;padding:6px}
  .tnext{border:0;background:#c0392b;color:#fff;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer}
  .tpoint{display:inline-block;animation:bob .9s infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="hbtn" href="index.html" id="backBtn">⬅ 🇬🇧</a>
    <h1>🇷🇺 Rus tili</h1>
    <button class="hbtn round" id="setBtn" aria-label="Sozlamalar">⚙️</button>
    <button class="hbtn round" id="helpBtn" aria-label="Yordam">❓</button>
  </div>
</header>
<main id="app"></main>

<div id="tourBlock" class="tblock" style="display:none"></div>
<div id="tourSpot" class="tspot" style="display:none"></div>
<div id="tourBubble" class="tbubble" style="display:none">
  <div id="tourText"></div>
  <div class="tbtns">
    <button id="tourSkip" class="tskip">O'tkazib yuborish</button>
    <button id="tourNext" class="tnext">Keyingi ➜</button>
  </div>
</div>

<script>
// 30 ta dars. w: [ruscha (urg'u belgisi bilan), o'qilishi, o'zbekcha]
// d: [kim, ruscha, o'zbekcha]   g: [savol, [variantlar], to'g'ri javob raqami, izoh]
const LESSONS = [
{ t:"Alifbo va o'qish", goal:"Rus harflarini o'qishni o'rganasiz",
  ex:`<p>Rus alifbosida <b>33 ta harf</b> bor. Agar o'zbek kirill yozuvini bilsangiz, harflarning ko'pi sizga tanish.</p>
<p><b>O'zbek kirillida yo'q yoki boshqacha o'qiladigan harflar:</b></p>
<ul><li><b>Ы ы</b> — "i" ga o'xshaydi, lekin tomoqroqdan: <b>сыр</b> [sir]</li>
<li><b>Щ щ</b> — yumshoq, cho'ziq "sh": <b>щи</b> [sh'i]</li>
<li><b>Ц ц</b> — "ts": <b>цирк</b> [tsirk]</li>
<li><b>Ь</b> — yumshatish belgisi, o'zi o'qilmaydi: <b>день</b> [den']</li>
<li><b>Ъ</b> — ajratish belgisi: <b>подъе́зд</b> [pad-yezd]</li></ul>
<p>Rus tilida <b>Ў, Қ, Ғ, Ҳ</b> harflari yo'q.</p>
<p><b>Urg'u juda muhim!</b> Urg'u tushmagan <b>o</b> ko'pincha <b>a</b> deb o'qiladi: <b>молоко́</b> → [malako]. Bu ilovada urg'uli unli ustida belgi bor: <b>а́</b>.</p>`,
  w:[["ма́ма","mama","ona"],["па́па","papa","ota"],["дом","dom","uy"],["вода́","vada","suv"],["молоко́","malako","sut"],["сыр","sir","pishloq"],["цирк","tsirk","sirk"],["э́то","eta","bu"],["ёлка","yolka","archa"],["день","den'","kun"]],
  d:[["A","Э́то дом?","Bu uymi?"],["B","Да, э́то дом.","Ha, bu uy."],["A","Э́то вода́?","Bu suvmi?"],["B","Нет, э́то молоко́.","Yo'q, bu sut."]],
  g:[["«молоко́» qanday o'qiladi?",["[moloko]","[malako]","[maloko]"],1,"Urg'usiz «o» «a» deb o'qiladi: [malako]."],
     ["Qaysi harf o'zi o'qilmaydi?",["Ы","Ц","Ь"],2,"Ь — yumshatish belgisi, o'zi tovush bermaydi."]] },

{ t:"Salomlashish", goal:"Salom berish va xayrlashishni o'rganasiz",
  ex:`<p><b>Здра́вствуйте</b> — rasmiy salom (kattalarga, notanishlarga). Birinchi «в» o'qilmaydi: [zdrastvuyte].</p>
<p><b>Приве́т</b> — do'stona salom (do'st, tengdoshga).</p>
<p><b>«Ты» va «Вы»:</b> ты — sen (yaqin odamga), Вы — siz (hurmat bilan, notanishga). Bilmasangiz, doim <b>Вы</b> deng.</p>`,
  w:[["Здра́вствуйте","zdrastvuyte","Assalomu alaykum (rasmiy)"],["Приве́т","privet","Salom (do'stona)"],["До́брое у́тро","dobraye utra","Xayrli tong"],["До́брый день","dobriy den'","Xayrli kun"],["До́брый ве́чер","dobriy vecher","Xayrli kech"],["Как дела́?","kak dela","Ishlar qalay?"],["Хорошо́","kharasho","Yaxshi"],["Спаси́бо","spasiba","Rahmat"],["Пожа́луйста","pazhalusta","Iltimos / Marhamat"],["До свида́ния","da svidaniya","Xayr (rasmiy)"],["Пока́","paka","Xayr (do'stona)"]],
  d:[["A","Здра́вствуйте!","Assalomu alaykum!"],["B","Здра́вствуйте!","Va alaykum assalom!"],["A","Как дела́?","Ishlar qalay?"],["B","Хорошо́, спаси́бо. А у вас?","Yaxshi, rahmat. Sizda-chi?"],["A","То́же хорошо́.","Menda ham yaxshi."],["B","До свида́ния!","Xayr!"]],
  g:[["Notanish odamga qanday salom berasiz?",["Приве́т","Здра́вствуйте","Пока́"],1,"Notanishga va kattalarga — Здравствуйте."]] },

{ t:"Tanishuv", goal:"O'zingizni tanishtirishni o'rganasiz",
  ex:`<p><b>Меня́ зову́т Алише́р</b> — Mening ismim Alisher (so'zma-so'z: «meni Alisher deb chaqirishadi»).</p>
<p><b>Из</b> = «-dan»: <b>из Узбекиста́на</b> — O'zbekistondan.</p>
<p><b>В</b> = «-da»: <b>в Ташке́нте</b> — Toshkentda. Shahar nomi oxiriga ko'pincha <b>-е</b> qo'shiladi: Москва́ → в Москве́.</p>`,
  w:[["Меня́ зову́т...","menya zavut","Mening ismim..."],["Как вас зову́т?","kak vas zavut","Ismingiz nima?"],["О́чень прия́тно","ochen' priyatna","Tanishganimdan xursandman"],["Отку́да вы?","atkuda vi","Qayerdansiz?"],["Я из Узбекиста́на","ya iz uzbekistana","Men O'zbekistondanman"],["Где вы живёте?","gde vi zhivyote","Qayerda yashaysiz?"],["Я живу́ в Москве́","ya zhivu v maskve","Men Moskvada yashayman"],["да","da","ha"],["нет","net","yo'q"],["и","i","va"]],
  d:[["A","Здра́вствуйте! Меня́ зову́т А́нна. А как вас зову́т?","Assalomu alaykum! Mening ismim Anna. Sizning ismingiz nima?"],["B","Меня́ зову́т Алише́р. О́чень прия́тно.","Mening ismim Alisher. Tanishganimdan xursandman."],["A","Отку́да вы?","Qayerdansiz?"],["B","Я из Узбекиста́на. Сейча́с я живу́ в Москве́.","Men O'zbekistondanman. Hozir Moskvada yashayman."]],
  g:[["«Toshkentda» ruschasi:",["из Ташке́нта","в Ташке́нте","Ташке́нт"],1,"«-da» — в + shahar + е: в Ташкенте."]] },

{ t:"Men, sen, u", goal:"Kishilik olmoshlari va oddiy gaplar",
  ex:`<p>Rus tilida hozirgi zamonda <b>«-man, -san» qo'shimchasi yo'q</b>, «bo'lmoq» fe'li esa tushib qoladi:</p>
<p><b>Я студе́нт.</b> — Men talabaman. <b>Он врач.</b> — U shifokor.</p>
<p>Inkor uchun <b>не</b>: <b>Я не врач.</b> — Men shifokor emasman.</p>
<p>«U» uchta: <b>он</b> (erkak), <b>она́</b> (ayol), <b>оно́</b> (narsa).</p>`,
  w:[["я","ya","men"],["ты","ti","sen"],["он","on","u (erkak)"],["она́","ana","u (ayol)"],["оно́","ano","u (narsa)"],["мы","mi","biz"],["вы","vi","siz"],["они́","ani","ular"],["студе́нт","student","talaba"],["врач","vrach","shifokor"],["бухга́лтер","buxgalter","buxgalter"]],
  d:[["A","Вы студе́нт?","Siz talabamisiz?"],["B","Нет, я не студе́нт. Я бухга́лтер.","Yo'q, men talaba emasman. Men buxgalterman."],["A","А он?","U-chi?"],["B","Он врач.","U shifokor."]],
  g:[["«Men shifokor emasman»:",["Я не врач.","Я врач не.","Не я врач."],0,"Inkor «не» so'zdan oldin keladi: Я не врач."],["«U (ayol)» ruschasi:",["он","она́","оно́"],1,"Ayol uchun — она."]] },

{ t:"Jins: он, она, оно", goal:"Otlarning jinsini ajratishni o'rganasiz",
  ex:`<p>Har bir ot «jins»ga ega. Oxiriga qarab bilasiz:</p>
<ul><li><b>он</b> (erkak) — oxiri undosh: <b>стол, дом, телефо́н</b></li>
<li><b>она́</b> (ayol) — oxiri <b>-а / -я</b>: <b>кни́га, ма́ма, неде́ля</b></li>
<li><b>оно́</b> (o'rta) — oxiri <b>-о / -е</b>: <b>окно́, мо́ре</b></li></ul>
<p>«Mening» ham jinsga qarab o'zgaradi: <b>мой</b> телефо́н, <b>моя́</b> кни́га, <b>моё</b> окно́.</p>
<p>Istisno: <b>па́па</b> -а bilan tugasa ham erkak.</p>`,
  w:[["стол","stol","stol"],["телефо́н","telefon","telefon"],["кни́га","kniga","kitob"],["ру́чка","ruchka","ruchka"],["окно́","akno","deraza"],["мо́ре","more","dengiz"],["мой","moy","mening (er.)"],["моя́","maya","mening (ay.)"],["моё","mayo","mening (o'rta)"],["Где?","gde","Qayerda?"],["вот","vot","mana"]],
  d:[["A","Где мой телефо́н?","Mening telefonim qayerda?"],["B","Вот твой телефо́н.","Mana sening telefoning."],["A","А где моя́ кни́га?","Mening kitobim qayerda?"],["B","Вот она́.","Mana u."]],
  g:[["«кни́га» qaysi jins?",["он","она́","оно́"],1,"-а bilan tugaydi — она."],["«... окно́» — to'g'ri so'zni tanlang:",["мой","моя́","моё"],2,"окно — o'rta jins, demak моё."]] },

{ t:"Sonlar 0–10", goal:"0 dan 10 gacha sanashni o'rganasiz",
  ex:`<p>«Bir» jinsga qarab o'zgaradi: <b>оди́н</b> дом, <b>одна́</b> кни́га, <b>одно́</b> окно́.</p>
<p>«Ikki»: <b>два</b> (erkak/o'rta), <b>две</b> (ayol): два до́ма, две кни́ги.</p>
<p>Telefon raqamini aytishda sonlarni ketma-ket aytasiz.</p>`,
  w:[["ноль","nol'","0"],["оди́н","adin","1"],["два","dva","2"],["три","tri","3"],["четы́ре","chetire","4"],["пять","pyat'","5"],["шесть","shest'","6"],["семь","sem'","7"],["во́семь","vosem'","8"],["де́вять","devyat'","9"],["де́сять","desyat'","10"]],
  d:[["A","Како́й у вас но́мер телефо́на?","Telefon raqamingiz qanaqa?"],["B","Де́вять, де́вять, во́семь, пять, три...","To'qqiz, to'qqiz, sakkiz, besh, uch..."],["A","Спаси́бо!","Rahmat!"]],
  g:[["«Ikkita kitob»:",["два кни́ги","две кни́ги","оди́н кни́ги"],1,"кни́га — ayol jinsi, shuning uchun две."]] },

{ t:"Sonlar va narx", goal:"Katta sonlar va narx so'rashni o'rganasiz",
  ex:`<p>11–19: oxiri <b>-надцать</b>: оди́ннадцать, двена́дцать...</p>
<p>20, 30: <b>два́дцать, три́дцать</b>. 40 — <b>со́рок</b>. 50–80: <b>-десят</b>: пятьдеся́т.</p>
<p><b>Pul bilan:</b> 1 рубль, 2–4 рубля́, 5–20 рубле́й. Masalan: 3 рубля, 10 рублей.</p>`,
  w:[["оди́ннадцать","adinatsat'","11"],["двена́дцать","dvenatsat'","12"],["два́дцать","dvatsat'","20"],["три́дцать","tritsat'","30"],["со́рок","sorak","40"],["пятьдеся́т","pidisyat","50"],["сто","sto","100"],["ты́сяча","tisyacha","1000"],["Ско́лько сто́ит?","skol'ka stoit","Qancha turadi?"],["рубль","rubl'","rubl"],["до́рого","doraga","qimmat"],["дёшево","dyosheva","arzon"]],
  d:[["A","Ско́лько сто́ит хлеб?","Non qancha turadi?"],["B","Со́рок рубле́й.","Qirq rubl."],["A","А молоко́?","Sut-chi?"],["B","Сто рубле́й.","Yuz rubl."],["A","До́рого!","Qimmat!"]],
  g:[["«5 rubl»:",["пять рубль","пять рубля́","пять рубле́й"],2,"5 dan 20 gacha — рублей."]] },

{ t:"Oila", goal:"Oila a'zolari va «menda bor»",
  ex:`<p><b>У меня́ есть...</b> — Menda ... bor. <b>У вас есть...?</b> — Sizda ... bormi?</p>
<p>Aka ham, uka ham — <b>брат</b>. Aniqroq: <b>ста́рший брат</b> (aka), <b>мла́дший брат</b> (uka). Opa/singil — <b>сестра́</b>.</p>`,
  w:[["семья́","sem'ya","oila"],["мать","mat'","ona"],["оте́ц","atets","ota"],["брат","brat","aka / uka"],["сестра́","sestra","opa / singil"],["сын","sin","o'g'il"],["дочь","doch'","qiz (farzand)"],["муж","mush","er"],["жена́","zhena","xotin"],["де́ти","deti","bolalar"],["У меня́ есть...","u menya yest'","Menda ... bor"]],
  d:[["A","У вас есть де́ти?","Farzandlaringiz bormi?"],["B","Да, у меня́ есть сын и дочь.","Ha, o'g'lim va qizim bor."],["A","А брат есть?","Akangiz (ukangiz) bormi?"],["B","Да, у меня́ есть ста́рший брат.","Ha, akam bor."]],
  g:[["«Menda opa bor»:",["У меня́ есть сестра́.","Я есть сестра́.","Меня́ сестра́ есть."],0,"«Menda bor» — У меня есть."]] },

{ t:"Fe'llar (1): работать", goal:"-ать fe'llarini shaxsga qarab o'zgartirish",
  ex:`<p>Fe'l kimga qarab o'zgaradi. <b>рабо́тать</b> (ishlamoq):</p>
<p>я рабо́та<b>ю</b> · ты рабо́та<b>ешь</b> · он/она́ рабо́та<b>ет</b><br>мы рабо́та<b>ем</b> · вы рабо́та<b>ете</b> · они́ рабо́та<b>ют</b></p>

</script>
<script>
// ===== Saqlash =====
const LS = {
  get(k, d){ try { const v = localStorage.getItem("ru_"+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("ru_"+k, JSON.stringify(v)); } catch(e){} }
};
let S = LS.get("state", null) || { pace:null, done:[], days:[] };  // done: [{i, date}], days: faol kunlar
function save(){ LS.set("state", S); }

// ===== Sana =====
function today(){ const d = new Date(Date.now() + (LS.get("dayOffset",0))*86400000); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayDiff(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000); }
function markActive(){ const t = today(); if (!S.days.includes(t)) { S.days.push(t); save(); } }
function streak(){
  const set = new Set(S.days); let n = 0; let d = today();
  if (!set.has(d)) { d = shift(d,-1); if (!set.has(d)) return 0; }
  while (set.has(d)) { n++; d = shift(d,-1); }
  return n;
}
function shift(s, k){ const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+k); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

const PACES = {
  slow:   { name:"Sekin",   per:"2 kunda 1 dars", total:"≈ 60 kun", mins:"kuniga 10–15 daqiqa" },
  normal: { name:"O'rtacha", per:"kuniga 1 dars",  total:"30 kun",   mins:"kuniga 20–25 daqiqa" },
  fast:   { name:"Tez",     per:"kuniga 2 dars",  total:"15 kun",   mins:"kuniga 40–50 daqiqa" }
};
function doneToday(){ const t = today(); return S.done.filter(x=>x.date===t).length; }
function canStartNew(){
  if (S.done.length >= LESSONS.length) return false;
  if (S.pace === "fast") return doneToday() < 2;
  if (S.pace === "normal") return doneToday() < 1;
  if (!S.done.length) return true;
  const last = S.done[S.done.length-1].date;
  return dayDiff(last, today()) >= 2;
}
function nextWhen(){
  if (S.pace !== "slow") return "ertaga";
  const last = S.done[S.done.length-1].date;
  const left = 2 - dayDiff(last, today());
  return left <= 1 ? "ertaga" : "indinga";
}

// ===== Ovoz (rus tili) =====
let ruVoice = null;
function pickVoice(){ const v = speechSynthesis.getVoices(); ruVoice = v.find(x=>/^ru/i.test(x.lang)) || null; }
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const clean = s => s.replace(/́/g,"").replace(/\.\.\./g,"");
function say(text, onend){
  if (!("speechSynthesis" in window)) { if (onend) onend(); return; }
  const u = new SpeechSynthesisUtterance(clean(text));
  u.lang = ruVoice ? ruVoice.lang : "ru-RU"; if (ruVoice) u.voice = ruVoice; u.rate = 0.8;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
function sayNow(t){ if ("speechSynthesis" in window) speechSynthesis.cancel(); say(t); }

const app = document.getElementById("app");
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let screen = "home", L = null, step = 0, stepList = [];

// ===== Ekranlar =====
function render(){
  if (!S.pace) return renderSetup();
  if (screen === "lesson") return renderStep();
  if (screen === "settings") return renderSettings();
  return renderHome();
}

function paceButtons(){
  return Object.entries(PACES).map(([k,p])=>`<button class="pace ${S.pace===k?'on':''}" data-p="${k}"><b>${p.name}</b> — ${p.per}<br><span class="muted">${p.total} · ${p.mins}</span></button>`).join("");
}
function renderSetup(){
  app.innerHTML = `<div class="box"><h2>👋 Xush kelibsiz!</h2>
    <p>Bu kurs rus tilini <b>noldan oddiy suhbat darajasigacha</b> o'rgatadi. Jami <b>30 ta dars</b>, har bir dars aniq tartib bilan boradi.</p>
    <p><b>Kuniga qancha vaqt ajrata olasiz?</b> O'zingiz tanlang — keyin ⚙️ orqali o'zgartirsa bo'ladi.</p>
    <div class="paces">${paceButtons()}</div></div>`;
  app.querySelectorAll(".pace").forEach(b=>b.onclick=()=>{ S.pace = b.dataset.p; save(); screen="home"; render(); });
}

function renderHome(){
  const n = S.done.length, total = LESSONS.length, finished = n >= total;
  const can = canStartNew();
  const p = PACES[S.pace];
  let plan;
  if (finished){
    plan = `<h2>🏆 Kurs tugadi!</h2><p>Siz 30 ta darsning hammasini o'tdingiz. Endi har kuni <b>Takrorlash</b> qiling va ruscha gaplashishga harakat qiling.</p>
      <button class="big" id="revBtn">🔁 Takrorlash</button>`;
  } else if (can){
    const l = LESSONS[n];
    plan = `<h2>📅 Bugungi reja</h2>
      <p><b>${n+1}-dars: ${l.t}</b><br><span class="muted">${l.goal}</span></p>
      <ol class="plan">${n>0?'<li>🔁 Takrorlash — kechagi so\'zlar (3 daq)</li>':''}
        <li>📖 Qoida — o'zbekcha tushuntirish (5 daq)</li>
        <li>🗂️ Yangi so'zlar — eshitish va takrorlash (5 daq)</li>
        <li>💬 Suhbat — tinglash (3 daq)</li>
        <li>✅ Mashq — test (4 daq)</li>
        <li>🗣️ Gapirish — ovoz chiqarib aytish (3 daq)</li></ol>
      <button class="big" id="startBtn">▶ Boshlash</button>`;
  } else {
    plan = `<h2>✅ Bugungi reja bajarildi!</h2>
      <p>Barakalla! Keyingi dars <b>${nextWhen()}</b> ochiladi. Tezlik: <b>${p.name}</b> (${p.per}).</p>
      <p class="muted">Bugun yana mashq qilmoqchi bo'lsangiz — o'rgangan so'zlaringizni takrorlang.</p>
      <button class="big sec" id="revBtn">🔁 Takrorlash</button>`;
  }
  const list = LESSONS.map((l,i)=>{
    const done = i < n, cur = i === n && can;
    const cls = done ? "done click" : cur ? "cur click" : "lock";
    const icon = done ? "✓" : (i+1);
    const tail = done ? "" : cur ? " ▶" : " 🔒";
    return `<div class="lrow ${cls}" data-i="${i}"><div class="n">${icon}</div><div>${i+1}. ${l.t}${tail}</div></div>`;
  }).join("");
  app.innerHTML = `
    <div class="box"><div class="stats">
      <div class="stat"><b>${n}/${total}</b><span class="muted">dars</span></div>
      <div class="stat"><b>🔥 ${streak()}</b><span class="muted">kun ketma-ket</span></div>
      <div class="stat"><b>${p.name}</b><span class="muted">${p.per}</span></div></div>
      <div class="bar"><i style="width:${Math.round(n/total*100)}%"></i></div></div>
    <div class="box" id="plan">${plan}</div>
    <div class="box" id="lessonList"><h2>📚 Darslar</h2><div class="muted" style="margin-bottom:6px">O'tilgan darslarni (✓) qayta ochib, takrorlashingiz mumkin.</div>${list}</div>`;
  const sb = document.getElementById("startBtn"); if (sb) sb.onclick = ()=>openLesson(n, true);
  const rb = document.getElementById("revBtn"); if (rb) rb.onclick = openReview;
  app.querySelectorAll(".lrow.done").forEach(r=>r.onclick=()=>openLesson(+r.dataset.i, false));
  const cr = app.querySelector(".lrow.cur"); if (cr) cr.onclick = ()=>openLesson(n, true);
  if (!can && !finished) setTimeout(()=>maybeTour("locked"), 150);
}

function renderSettings(){
  app.innerHTML = `<div class="box"><h2>⚙️ Sozlamalar</h2>
    <p><b>Tezlik</b> — kuniga nechta dars ochilsin:</p><div class="paces">${paceButtons()}</div>
    <button class="big sec" id="backHome">⬅ Orqaga</button></div>
    <div class="box"><h2>Qaytadan boshlash</h2><p class="muted">Barcha natijalar o'chadi va kurs 1-darsdan boshlanadi.</p>
    <button class="big sec" id="resetBtn">Kursni qaytadan boshlash</button><div id="resetAsk"></div></div>`;
  app.querySelectorAll(".pace").forEach(b=>b.onclick=()=>{ S.pace=b.dataset.p; save(); renderSettings(); });
  document.getElementById("backHome").onclick = ()=>{ screen="home"; render(); };
  document.getElementById("resetBtn").onclick = ()=>{
    document.getElementById("resetAsk").innerHTML = `<p><b>Rostdan ham hammasini o'chirasizmi?</b></p><button class="big" id="resetYes">Ha, o'chirish</button>`;
    document.getElementById("resetYes").onclick = ()=>{ S = { pace:S.pace, done:[], days:[] }; save(); screen="home"; render(); };
  };
}

// ===== Dars =====
let isNew = false, reviewMode = false;
function openLesson(i, fresh){
  L = LESSONS[i]; L.idx = i; isNew = fresh; reviewMode = false;
  stepList = (fresh && i > 0 ? ["review"] : []).concat(["explain","words","dialog","quiz","speak","finish"]);
  step = 0; QS = []; qi = 0; screen = "lesson"; markActive(); render(); window.scrollTo(0,0);
}
function openReview(){
  L = null; reviewMode = true; isNew = false; stepList = ["review","finish"]; step = 0; QS = []; qi = 0; screen = "lesson"; markActive(); render();
}
function learnedWords(){
  const n = Math.max(S.done.length, 1);
  return LESSONS.slice(0, n).flatMap(l=>l.w);
}
function nextStep(){ step++; render(); window.scrollTo(0,0); }

const STEP_NAMES = { review:"🔁 Takrorlash", explain:"📖 Qoida", words:"🗂️ Yangi so'zlar", dialog:"💬 Suhbat", quiz:"✅ Mashq", speak:"🗣️ Gapirish", finish:"🎉 Yakun" };
function head(){
  const dots = stepList.map((s,i)=>`<i class="${i<=step?'on':''}"></i>`).join("");
  const title = reviewMode ? "Takrorlash" : `${L.idx+1}-dars: ${L.t}`;
  return `<div class="steps">${dots}</div><div class="muted" style="display:flex;justify-content:space-between"><span>${title}</span><a href="#" id="exitL" style="color:#c0392b">✕ Chiqish</a></div><h2>${STEP_NAMES[stepList[step]]}</h2>`;
}
function nextBtn(label, hidden){ return `<button class="big" id="nextBtn" ${hidden?'style="display:none"':''}>${label||"Keyingi ➜"}</button>`; }

document.addEventListener("click", e=>{ if (e.target && e.target.id === "exitL"){ e.preventDefault(); QS=[]; qi=0; screen="home"; render(); window.scrollTo(0,0); } });
function renderStep(){
  const s = stepList[step];
  if (s === "explain"){
    app.innerHTML = `<div class="box">${head()}<p><b>🎯 ${L.goal}</b></p><div class="lex">${L.ex}</div>${nextBtn()}</div>`;
  }
  if (s === "words"){
    app.innerHTML = `<div class="box">${head()}<p class="muted">So'zni bosing — ruscha eshitasiz. Har birini ovoz chiqarib 2 marta takrorlang.</p>
      <div class="grid">${L.w.map((w,i)=>`<div class="card" data-i="${i}"><div class="ru">${w[0]}</div><div class="tr">[${w[1]}]</div><div class="uz">${w[2]}</div></div>`).join("")}</div>${nextBtn()}</div>`;
    app.querySelectorAll(".card").forEach(c=>c.onclick=()=>sayNow(L.w[c.dataset.i][0]));
  }
  if (s === "dialog"){
    app.innerHTML = `<div class="box">${head()}<p class="muted">Gapni bosing — eshitasiz. Avval tinglang, keyin o'zingiz o'qing.</p>
      <button class="say" id="playAll">🔊 Butun suhbatni eshitish</button>
      <div style="margin-top:8px">${L.d.map((d,i)=>`<div class="dline" data-i="${i}"><div class="who">${d[0]}</div><div><div class="ru">${d[1]}</div><div class="uz">${d[2]}</div></div></div>`).join("")}</div>${nextBtn()}</div>`;
    app.querySelectorAll(".dline").forEach(x=>x.onclick=()=>sayNow(L.d[x.dataset.i][1]));
    document.getElementById("playAll").onclick = ()=>{ speechSynthesis.cancel(); let k=0; const go=()=>{ if(k<L.d.length) say(L.d[k++][1], go); }; go(); };
  }
  if (s === "quiz" || s === "review") return renderQuiz(s);
  if (s === "speak"){
    const items = shuffle(L.w.slice()).slice(0,3).concat(L.d.length ? [[L.d[0][1], "", L.d[0][2]]] : []);
    app.innerHTML = `<div class="box">${head()}<p class="muted">O'zbekcha gapni <b>ruscha ovoz chiqarib</b> ayting. Keyin tugmani bosib, o'zingizni tekshiring.</p>
      ${items.map((w,i)=>`<div class="sp"><div class="sprompt">🇺🇿 ${w[2]}</div><button class="reveal" data-i="${i}">👀 Javobni ko'rish va eshitish</button><div class="ans" id="ans${i}">🇷🇺 ${w[0]}</div></div>`).join("")}
      ${nextBtn()}</div>`;
    app.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>{ const i=b.dataset.i; document.getElementById("ans"+i).style.display="block"; sayNow(items[i][0]); });
  }
  if (s === "finish"){
    if (reviewMode){
      app.innerHTML = `<div class="box center">${head()}<p style="font-size:40px;margin:6px">💪</p><p>Takrorlash tugadi! Har kuni bir oz takrorlash — eng yaxshi usul.</p>${nextBtn("🏠 Bosh sahifa")}</div>`;
    } else {
      if (isNew && !S.done.some(x=>x.i===L.idx)) { S.done.push({ i:L.idx, date:today() }); markActive(); save(); }
      const last = L.idx === LESSONS.length-1;
      app.innerHTML = `<div class="box center">${head()}<p style="font-size:44px;margin:6px">🎉</p>
        <p><b>${L.idx+1}-dars tugadi!</b></p><p>${last ? "Siz butun kursni tugatdingiz! Endi rus tilida oddiy suhbat qila olasiz." : "Barakalla! Bugungi rejaning shu qismini bajardingiz."}</p>
        ${nextBtn("🏠 Bosh sahifa")}</div>`;
    }
    document.getElementById("nextBtn").onclick = ()=>{ screen="home"; render(); window.scrollTo(0,0); };
    setTimeout(()=>maybeTour("finish"), 150);
    return;
  }
  const nb = document.getElementById("nextBtn"); if (nb) nb.onclick = nextStep;
  setTimeout(()=>maybeTour(s), 150);
}

function makeQuestions(kind){
  const qs = [];
  const pool = kind === "review" ? learnedWords() : (L.idx === LESSONS.length-1 ? LESSONS.flatMap(l=>l.w) : L.w);
  if (kind === "quiz" && L.g) L.g.forEach(g=>qs.push({ q:g[0], opts:g[1].slice(), ans:g[1][g[2]], why:g[3], sayIt:null }));
  const need = kind === "review" ? 5 : 6;
  const picks = shuffle(pool.slice()).slice(0, Math.max(0, need - qs.length));
  picks.forEach((w,k)=>{
    const others = shuffle(pool.filter(x=>x!==w)).slice(0,3);
    if (k % 2 === 0) qs.push({ q:`<b>${w[0]}</b> — bu nima degani?`, opts:shuffle([w[2], ...others.map(o=>o[2])]), ans:w[2], why:`${w[0]} [${w[1]}] — ${w[2]}`, sayIt:w[0] });
    else qs.push({ q:`Ruschasini toping: <b>«${w[2]}»</b>`, opts:shuffle([w[0], ...others.map(o=>o[0])]), ans:w[0], why:`«${w[2]}» — ${w[0]} [${w[1]}]`, sayIt:w[0] });
  });
  return qs;
}
let QS = [], qi = 0, score = 0;
function renderQuiz(kind){
  if (qi === 0 && !QS.length) { QS = makeQuestions(kind); score = 0; }
  if (qi >= QS.length){
    const n = QS.length;
    app.innerHTML = `<div class="box center">${head()}<p style="font-size:40px;margin:6px">${score===n?'🌟':score>=n/2?'👍':'💪'}</p>
      <p><b>Natija: ${score} / ${n}</b></p><p class="muted">${score===n?'A\'lo!':score>=n/2?'Yaxshi! Xatolarni yana bir ko\'rib chiqing.':'Qo\'rqmang — so\'zlarni yana bir marta takrorlang.'}</p>${nextBtn()}</div>`;
    document.getElementById("nextBtn").onclick = ()=>{ QS=[]; qi=0; nextStep(); };
    return;
  }
  const q = QS[qi];
  app.innerHTML = `<div class="box">${head()}<div class="muted center">${qi+1} / ${QS.length}</div>
    <div class="q">${q.q}</div>${q.sayIt?`<div class="center" style="margin-bottom:10px"><button class="say" id="qSay">🔊 Eshitish</button></div>`:""}
    <div class="opts">${q.opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}</div>
    <div class="fb" id="fb"></div>${nextBtn("Keyingi savol ➜", true)}</div>`;
  const qs = document.getElementById("qSay"); if (qs) qs.onclick = ()=>sayNow(q.sayIt);
  let done = false;
  app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
    if (done) return; done = true;
    const fb = document.getElementById("fb");
    if (q.opts[b.dataset.i] === q.ans){ score++; b.classList.add("ok"); fb.style.color="#27ae60"; fb.textContent = "To'g'ri! 🎉 " + q.why; }
    else { b.classList.add("bad"); app.querySelectorAll(".opts button").forEach(x=>{ if(q.opts[x.dataset.i]===q.ans) x.classList.add("ok"); }); fb.style.color="#e04848"; fb.textContent = "Xato. " + q.why; }
    if (q.sayIt) sayNow(q.sayIt);
    document.getElementById("nextBtn").style.display = "block";
  });
  document.getElementById("nextBtn").onclick = ()=>{ qi++; renderQuiz(kind); window.scrollTo(0,0); };
  setTimeout(()=>maybeTour(kind), 150);
}

// ===== O'rgatish: ko'rsatamiz va bosib ko'rdiramiz =====
const $ = s => document.querySelector(s);
const POINT = '<span class="tpoint">👆</span>';
const TOURS = {
  intro: [
    { text:'<span class="bigt">👋 Assalomu alaykum!</span>Bu kurs rus tilini <b>noldan suhbat darajasigacha</b> o\'rgatadi. Hammasi o\'zbekcha tushuntiriladi.<br>Men ko\'rsataman — <b>siz o\'zingiz bosasiz</b>.', btn:"Boshladik! 🚀" },
    { el:()=>$(".paces"), text:`Avval <b>tezlikni</b> tanlang: kuniga qancha vaqtingiz bor? Bittasini bosing ${POINT}`, wait:true },
    { el:()=>$("#plan"), text:'Bu — <b>bugungi reja</b>. Har kuni shu tartibda: takrorlash → qoida → so\'zlar → suhbat → mashq → gapirish.' },
    { el:()=>$("#lessonList"), text:'Bu yerda <b>30 ta dars</b>. Tanlagan tezligingizga qarab, har kuni yangisi ochiladi 🔒' },
    { el:()=>$(".stats"), text:'Bu yerda natijangiz: nechta dars o\'tdingiz va necha kun <b>ketma-ket</b> o\'qidingiz 🔥' },
    { el:()=>$("#startBtn"), text:`Birinchi darsni boshlaymiz! Bosing ${POINT}`, wait:true }
  ],
  explain: [
    { el:()=>$(".lex"), text:'Bu yerda <b>qoida</b> o\'zbekcha tushuntirilgan. Shoshilmasdan o\'qing.' },
    { el:()=>$("#nextBtn"), text:`O'qib bo'lgach <b>«Keyingi»</b> ni bosing ${POINT}`, wait:true }
  ],
  words: [
    { el:()=>$(".card"), text:`So'zni bosing — <b>ruscha talaffuzini</b> eshitasiz ${POINT}`, wait:true },
    { el:()=>$(".card .tr"), text:'Qavs ichida — so\'z <b>qanday o\'qilishi</b> lotin harflarida. Ovoz chiqarib takrorlang!' },
    { el:()=>$("#nextBtn"), text:'Hamma so\'zlarni eshitib, takrorlagach — <b>«Keyingi»</b>.' }
  ],
  dialog: [
    { el:()=>$(".dline"), text:`Gapni bosing — eshitasiz ${POINT}`, wait:true },
    { el:()=>$("#playAll"), text:'Bu tugma <b>butun suhbatni</b> boshidan oxirigacha o\'qib beradi.' }
  ],
  quiz: [
    { el:()=>$(".opts"), text:`Endi mashq. To'g'ri javobni tanlang ${POINT}`, wait:true },
    { el:()=>$("#fb"), text:'Bu yerda javob <b>izohi</b> chiqadi. Xato qilsangiz ham — izohni o\'qing.' },
    { el:()=>$("#nextBtn"), text:`Keyingi savolga o'tish uchun bosing ${POINT}`, wait:true }
  ],
  review: [
    { el:()=>$(".opts"), text:`Har bir dars <b>takrorlash</b> bilan boshlanadi — oldingi so'zlarni eslaysiz. Javobni tanlang ${POINT}`, wait:true }
  ],
  speak: [
    { el:()=>$(".sprompt"), text:'Bu gapni <b>ruscha ovoz chiqarib</b> ayting. Gapirish — eng muhim mashq!' },
    { el:()=>$(".reveal"), text:`Aytib bo'lgach, tekshirish uchun bosing ${POINT}`, wait:true }
  ],
  finish: [
    { el:()=>$("#nextBtn"), text:'Dars tugadi! Bosh sahifada keyingi dars qachon ochilishini ko\'rasiz.' }
  ],
  locked: [
    { el:()=>$("#plan"), text:'Bugungi reja bajarildi ✅ Keyingi dars tanlagan tezligingiz bo\'yicha ochiladi. Bugun yana mashq qilmoqchi bo\'lsangiz — <b>«Takrorlash»</b> ni bosing.' },
    { el:()=>$("#setBtn"), text:'Tezlikni xohlagan payt <b>⚙️</b> orqali o\'zgartirasiz. <b>❓</b> esa shu ekranni yana tushuntiradi.' }
  ]
};
const tb = $("#tourBlock"), ts = $("#tourSpot"), tbub = $("#tourBubble");
let steps = [], si = 0, curEl = null;
const tourOn = () => tb.style.display === "block";
function seen(k){ return LS.get("seen_"+k, false); }
function setSeen(k){ LS.set("seen_"+k, true); }
function maybeTour(k){ if (tourOn() || seen(k) || !TOURS[k]) return; setSeen(k); startTour(TOURS[k]); }
function startTour(list){ steps = list; si = 0; tb.style.display = "block"; showStep(); }
function endTour(){ tb.style.display = ts.style.display = tbub.style.display = "none"; curEl = null; }
function place(){
  if (!steps[si]) return;
  if (curEl){
    const r = curEl.getBoundingClientRect(), pad = 6;
    ts.className = "tspot"; ts.style.display = "block";
    Object.assign(ts.style, { left:(r.left-pad)+"px", top:(r.top-pad)+"px", width:(r.width+pad*2)+"px", height:(r.height+pad*2)+"px" });
    const below = r.bottom + 14, bh = tbub.offsetHeight || 150;
    tbub.style.top = (below + bh < window.innerHeight ? below : Math.max(10, r.top - bh - 14)) + "px";
  } else {
    ts.className = "tspot none"; ts.style.display = "block";
    Object.assign(ts.style, { left:"50%", top:"50%", width:"0px", height:"0px" });
    tbub.style.top = Math.max(20, (window.innerHeight - (tbub.offsetHeight||200)) / 2) + "px";
  }
}
function showStep(){
  const st = steps[si];
  if (!st){ endTour(); return; }
  setTimeout(()=>{
    curEl = st.el ? st.el() : null;
    if (st.el && !curEl){ si++; showStep(); return; }
    if (curEl) curEl.scrollIntoView({ block:"center", behavior:"instant" });
    $("#tourText").innerHTML = st.text;
    const nb = $("#tourNext");
    nb.style.display = st.wait ? "none" : "inline-block";
    nb.textContent = st.btn || "Keyingi ➜";
    tbub.style.display = "block";
    requestAnimationFrame(place);
  }, 140);
}
function advance(){ si++; showStep(); }
tb.addEventListener("click", e=>{
  const st = steps[si]; if (!st || !st.wait || !curEl) return;
  tb.style.pointerEvents = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  tb.style.pointerEvents = "";
  if (under && curEl.contains(under)){ under.click(); advance(); }
});
$("#tourNext").onclick = advance;
$("#tourSkip").onclick = endTour;
window.addEventListener("resize", place);
window.addEventListener("scroll", place, true);

$("#helpBtn").onclick = ()=>{
  if (tourOn()) return;
  if (!S.pace || screen === "home") { if (!S.pace) startTour(TOURS.intro.slice(0,2)); else startTour(TOURS.intro.slice(2).filter(s=>!s.wait || $("#startBtn"))); return; }
  if (screen === "lesson") { const k = stepList[step]; if (TOURS[k]) startTour(TOURS[k]); }
};
$("#setBtn").onclick = ()=>{ if (tourOn()) return; if (!S.pace) return; screen = "settings"; render(); };

render();
if (!seen("intro")) { setSeen("intro"); startTour(S.pace ? TOURS.intro.slice(2) : TOURS.intro); }
</script>
